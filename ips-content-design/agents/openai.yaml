display_name: ips-content-design
short_description: Plan, review, and write content from the reader's need, with a job story, one question per page, a priority guide, a chosen form for each element, a content model for generated pages, and a line-by-line copy check, so AI-generated content does not turn into slop.
default_prompt: Use ips-content-design on this content. Write the job story and the one question the page answers, rank what goes on it, choose a form for each element, define a content model if a model will generate it, then check the copy line by line.
